[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "devbuilder"
version = "0.2.3"
description = "Deployment builder with two encoders and one decoder."
authors = [
    { name = "Silvia Onofrei" }
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
  # Core ML / retrieval
  "numpy>=2.4",
  "qdrant-client>=1.17",
  "onnxruntime>=1.23",
  "transformers==4.57.5",

  # OpenAI-compatible decoder client
  "openai>=2.15",

  # Config / utilities
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.128",
  "uvicorn[standard]",
]

runpod = [
  "runpod>=1.9.0",
  "httpx>=0.27",
  "tenacity>=9.0",
]
vps = [
  "pydo>=0.5",
  "httpx>=0.27",
  "tenacity>=9.0",
]
export = [
  "onnx>=1.21",
  "optimum[onnxruntime]",
  "torch",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff==0.15.15",
  "pre-commit>=4.0",
  "httpx2",   # starlette.testclient backend
]
# The Gradio UI is a thin HTTP client of the API and imports nothing else from
# the package, so it is a group rather than an extra: `uv sync --only-group ui`
# builds the UI image without the ML runtime dependencies.
ui = [
  "gradio>=6.0",
  "httpx>=0.27",
]

[project.scripts]
devbuilder = "devbuilder.cli:main"
devbuilder-deploy = "devbuilder.deploy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "integration: downloads models and runs ONNX export (slow, network)",
  "artifact(kind): needs an exported 'encoder' or 'reranker' under artifacts/models",
]
