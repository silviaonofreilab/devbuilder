# Lint + test on every PR and on pushes to the integration branches.
#
# Runs ruff (lint + format check) and the pytest suite.

name: ci

on:
  pull_request:
  push:
    branches: [main, dev, deployment]

permissions:
  contents: read

# Cancel superseded runs on the same ref (PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.17.1
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          python-version: "3.11"
          enable-cache: true

      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('configs/settings.yaml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Wait for Qdrant
        run: |
          for i in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/6333) 2>/dev/null && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready" >&2; exit 1

      # `artifact` tests skip themselves (no exports in CI); `integration`
      # runs, exercising export end to end with the HF cache. No secrets needed.
      - name: Test
        run: uv run pytest -q
