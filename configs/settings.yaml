# Configuration sample

project:
  name: devbuilder
  version: "0.2.3"

data:
  raw_file: alice.txt
  chunk_size: 256
  chunk_overlap_sentences: 1

vectorstore:
  name: qdrant_miniLM
  top_k_default: 2
  host: ${QDRANT_HOST:-localhost}
  port: ${QDRANT_PORT:-6333}

encoder:
  model_id: sentence-transformers/all-MiniLM-L6-v2
  revision: null                           # null = Hub default; the export records the resolved commit in the manifest
  model_name: all_MiniLM
  embedding_dim: 384                       # export contract; runtime reads the manifest
  max_length: 256
  batch_size: 16
  normalize: true
  pooling: mean                            # mean | max | cls
  onnx_optimize: "O3"
  onnx_quantize: int8                     # dynamic INT8 weights (ORT quantize_dynamic); not CPU-specific

reranker:
  model_id: cross-encoder/ms-marco-MiniLM-L6-v2
  revision: null
  model_name: ms_marco_MiniLM
  task: text-classification          # cross-encoder head
  max_length: 512                    # combined query+passage, not per-text
  batch_size: 32                     # (query, passage) pairs per forward
  fetch_k: 10
  onnx_optimize: "O3"
  onnx_quantize: int8

decoder:
  model_id: allenai/OLMo-2-0425-1B-Instruct      # served model
  base_url: ${VLLM_ENDPOINT:-}                   # RunPod URL, from env
  timeout_s: 30                                  # HTTP client timeout
  max_tokens: 256                                # generation cap per request (answers are 1-2 sentences)
  max_prompt_chars: 4000                         # assembled prompt cap, heuristic (~1000 tokens); see api.py
  temperature: 0.0                               # deterministic output

runpod:
  gpu_type: NVIDIA L4
  gpu_count: 1
  cloud_type: SECURE
  container_disk_gb: 20
  volume_gb: 20
  max_model_len: 2048             # prompt + generation; margin over max_prompt_chars/4 + max_tokens
  gpu_memory_utilization: 0.9
  max_num_seqs: 256               # concurrency cap


vps:
  digitalocean:
    name: devbuilder-vps
    region: sfo3
    size: s-2vcpu-4gb
    image: ubuntu-24-04-x64
    ssh_key_fingerprint: ${DO_SSH_KEY_FINGERPRINT:-}   # required by droplet-up only
    tags:
      - devbuilder

serving:
  orchestrator_port: 8080           # FastAPI on VPS
  vllm_port:  8000                  # vLLM on RunPod (matches image default)

examples:
  queries:
    mad_hatter: "Who is the Hatter?"
    tea_party: "What happens at the tea party?"
    queen_hearts: "Who is the Queen of Hearts?"
    alice_size: "Why is Alice confused about her size?"

prompts:
  system: "You are a precise assistant. If unsure, say you are unsure."
  rag_template: |
    Answer the question in 1-2 sentences using only the context. If the context does not contain the answer, say you don't know.

    Context:
    {context}

    Question: {query}

    Answer:
